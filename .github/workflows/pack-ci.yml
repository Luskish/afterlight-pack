name: pack-ci
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pack-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@dfd8b68a4796c763e25bad50265ea1f1233e24f1 && echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Manifest integrity
        run: |
          packwiz refresh
          git diff --exit-code index.toml pack.toml || (echo "::error::index.toml drifted: run packwiz refresh and commit" && exit 1)
      - name: Export artifacts
        run: ./tools/export.sh
      - name: Headless server boot smoke test
        run: BOOT_TIMEOUT=600 ./tools/server-test.sh
      # Metadata only. The CurseForge zip embeds mod jars and is friends-only
      # (docs/INSTALL.md): never publish it from a public run page.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterlight-dist
          path: dist/*.mrpack
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-test-logs
          path: |
            server-test/boot.log
            server-test/logs/
          if-no-files-found: ignore
