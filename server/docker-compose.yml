name: afterlight
services:
  minecraft:
    image: itzg/minecraft-server:2026.8.0-java21@sha256:b76b9298a2a60d5cf9d223e009cd0b8ad620c2080abd83f9a1fa5084fa87f9ab
    restart: unless-stopped
    init: true
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.248"
      UID: ${AFTERLIGHT_DATA_UID:?AFTERLIGHT_DATA_UID must be set}
      GID: ${AFTERLIGHT_DATA_GID:?AFTERLIGHT_DATA_GID must be set}
      PACKWIZ_URL: ${AFTERLIGHT_PACKWIZ_URL:-https://luskish.github.io/afterlight-pack/pack.toml}
      INIT_MEMORY: ${AFTERLIGHT_INIT_MEMORY:-4G}
      MAX_MEMORY: ${AFTERLIGHT_MAX_MEMORY:-10G}
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
    ports:
      - "0.0.0.0:25565:25565/tcp"
      - "0.0.0.0:24454:24454/udp"
    secrets: [rcon_password]
    volumes:
      - type: bind
        source: ${DATA_DIR:?DATA_DIR must be set}
        target: /data
        bind: { create_host_path: false }
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 10s
      timeout: 5s
      retries: 48
      start_period: 2m
    mem_limit: ${AFTERLIGHT_MEMORY_LIMIT:-13G}
    mem_swappiness: 1
    stop_grace_period: 2m
  backup:
    image: itzg/mc-backup:2026.8.0@sha256:ae54d88d1a5dfbc185f1f94e50bb2e9b68484719013f4f21c573422dd4950f32
    restart: unless-stopped
    init: true
    depends_on:
      minecraft: { condition: service_healthy }
    environment:
      RCON_HOST: minecraft
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      BACKUP_METHOD: tar
      TAR_COMPRESS_METHOD: zstd
      BACKUP_INTERVAL: "6h"
      INITIAL_DELAY: "0"
      BACKUP_ON_STARTUP: "true"
      ENABLE_SAVE_ALL: "true"
      ENABLE_SYNC: "true"
      EXCLUDES: ""
      EXCLUDES_FILE: /etc/afterlight-backup-excludes.txt
      PRUNE_BACKUPS_DAYS: "14"
      LINK_LATEST: "false"
    secrets: [rcon_password]
    volumes:
      - type: bind
        source: ${DATA_DIR:?DATA_DIR must be set}
        target: /data
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR must be set}
        target: /backups
        bind: { create_host_path: false }
      - ./backup-excludes.txt:/etc/afterlight-backup-excludes.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "entrypoint-demoter --match /backups sh -ec 'test -r /data/server.properties && test -w /backups && mc-monitor status --host minecraft --port 25565'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
secrets:
  rcon_password:
    file: ${SECRETS_DIR:?SECRETS_DIR must be set}/rcon_password
