name: pack-ci
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pack-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.5" }
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@dfd8b68a4796c763e25bad50265ea1f1233e24f1 && echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Manifest integrity
        run: |
          packwiz refresh
          git diff --exit-code index.toml pack.toml || (echo "::error::index.toml drifted: run packwiz refresh and commit" && exit 1)
      - name: Export artifacts
        run: ./tools/export.sh
      - name: Headless server boot smoke test
        run: BOOT_TIMEOUT=600 ./tools/server-test.sh
      # No pack artifacts are uploaded: both export formats can embed
      # third-party jars once CurseForge-sourced mods exist in the pack
      # (docs/INSTALL.md marks them friends-only). The export step above
      # still proves the pipeline works; Shane builds share-files locally
      # with tools/export.sh.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: server-test-logs
          path: |
            server-test/boot.log
            server-test/logs/
          if-no-files-found: ignore
